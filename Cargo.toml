# SPDX-License-Identifier: GPL-2.0
[package]
name = "kconfirm"
repository = "https://github.com/julianbraha/kconfirm"
license-file = "LICENSE"
description = "A static analysis tool for Kconfig"
keywords = ["kconfig", "static", "analysis", "detect"]
categories = ["development-tools", "config", "command-line-utilities"]
exclude = ["assets/", "findings/"]
version = "1.0.0"
edition = "2024"

[workspace]
members = [
    "kconfirm-lib",
    "kconfirm-cli",
    "kconfirm-linux",
    "kconfirm-desugar",
    "kconfirm-smt",
    "z3-ternary"]
resolver = "3"

[workspace.package]
rust-version = "1.85.1"

[workspace.dependencies]
nom-kconfig = { git = "https://github.com/julianbraha/nom-kconfig", rev = "2882d6929ee4a24126ee0f7e7be8366f0c6aeb62", default-features = false, features = [
    "display",
    "kconfiglib",
] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
z3 = { version = "0.21", features = ["gh-release"] }

[profile.release]
lto = true
codegen-units = 1
